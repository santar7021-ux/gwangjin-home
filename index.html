<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>남양주 먹골배 광진농원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --br:#2D1F0E;--bm:#4A3020;
  --gr:#3B5A28;--gm:#5A8040;
  --gd:#F0F5EA;--cream:#FAF7F2;--ivory:#F5EFE5;
  --gold:#C8A050;
  --txt:#1A1008;--txt2:#5A4030;--txt3:#9A8070;
  --bd:#D8C8B0;--bds:#EAD8C0;
  --shadow:0 4px 24px rgba(45,31,14,.12);
  --r:14px;--r-sm:9px;
  --hh:60px;
  --hh-pc:72px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--txt);min-height:100vh;}

/* ══ 헤더 ══ */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:900;
  height:var(--hh);
  background:rgba(250,247,242,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bds);
  display:flex;align-items:center;
  padding:0 16px;gap:8px;
}
.hdr-logo{display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;min-width:0;}
.hdr-logo-ico{font-size:24px;line-height:1;flex-shrink:0;}
.hdr-logo-text{min-width:0;}
.hdr-logo-main{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700;color:var(--br);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-logo-sub{font-size:10px;color:var(--txt3);white-space:nowrap;}
.hdr-btns{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.btn-admin{border:1.5px solid var(--bd);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--txt2);background:none;cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-order-hd{border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gr),var(--gm));cursor:pointer;font-family:inherit;white-space:nowrap;}

/* PC 헤더 */
@media(min-width:768px){
  .hdr{padding:0 48px;gap:20px;height:72px;}
  .hdr-logo-ico{font-size:32px;}
  .hdr-logo-main{font-size:20px;}
  .hdr-logo-sub{font-size:12px;}
  .btn-admin{padding:8px 18px;font-size:13px;border-radius:22px;}
  .btn-order-hd{padding:9px 20px;font-size:13px;border-radius:22px;}
}

/* ══ 팝업 ══ */
.popup-ov{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;}
.popup-ov.show{display:flex;}
.popup-modal{background:#fff;border-radius:20px;overflow:hidden;max-width:440px;width:100%;box-shadow:0 20px 70px rgba(0,0,0,.35);animation:popIn .3s ease;}
@media(min-width:768px){.popup-modal{max-width:520px;}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(20px);}to{opacity:1;transform:none;}}
.popup-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
.popup-img-ph{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,var(--br),var(--bm));display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;}
.popup-body{padding:20px 22px;}
.popup-title{font-size:18px;font-weight:800;color:var(--br);margin-bottom:8px;}
@media(min-width:768px){.popup-title{font-size:22px;}}
.popup-desc{font-size:14px;color:var(--txt2);line-height:1.7;}
@media(min-width:768px){.popup-desc{font-size:16px;}}
.popup-foot{display:flex;border-top:1px solid var(--bds);}
.popup-btn{flex:1;padding:14px;border:none;background:none;font-size:14px;cursor:pointer;font-family:inherit;}
@media(min-width:768px){.popup-btn{padding:16px;font-size:15px;}}
.popup-btn:first-child{color:var(--txt3);}
.popup-btn:last-child{font-weight:700;color:var(--gr);border-left:1px solid var(--bds);}

/* ══ 배너 ══ */
.banner-wrap{
  margin-top:var(--hh);
  position:relative;overflow:hidden;
  width:100%;height:220px;
  background:var(--br);
}
@media(min-width:480px){.banner-wrap{height:260px;}}
@media(min-width:768px){.banner-wrap{height:420px;margin-top:72px;}}
@media(min-width:1024px){.banner-wrap{height:520px;}}
@media(min-width:1280px){.banner-wrap{height:580px;}}

.banner-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);}
.banner-slide{min-width:100%;height:100%;position:relative;flex-shrink:0;}
.banner-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.banner-slide-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;}
.banner-ov{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.65) 100%);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  padding:20px;
}
@media(min-width:768px){.banner-ov{padding:32px 48px;}}
@media(min-width:1024px){.banner-ov{padding:40px 60px;}}
.banner-title{
  font-family:'Noto Serif KR',serif;font-weight:700;color:#fff;
  line-height:1.3;margin-bottom:6px;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  font-size:22px;
}
@media(min-width:768px){.banner-title{font-size:32px;margin-bottom:8px;}}
@media(min-width:1024px){.banner-title{font-size:40px;}}
.banner-sub{font-size:13px;color:rgba(255,255,255,.9);}
@media(min-width:768px){.banner-sub{font-size:16px;}}
.banner-dots{position:absolute;bottom:12px;right:14px;display:flex;gap:5px;}
.banner-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:.3s;}
.banner-dot.act{background:#fff;width:20px;border-radius:3px;}
.banner-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.2);backdrop-filter:blur(4px);
  border:none;color:#fff;cursor:pointer;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
@media(min-width:768px){.banner-nav{width:44px;height:44px;font-size:22px;}}
.banner-nav.prev{left:10px;}
.banner-nav.next{right:10px;}
@media(min-width:768px){.banner-nav.prev{left:20px;}.banner-nav.next{right:20px;}}

/* ══ 메인 콘텐츠 ══ */
.main{width:100%;max-width:1200px;margin:0 auto;padding:0 16px 120px;}
@media(min-width:768px){.main{padding:0 40px 120px;}}
@media(min-width:1024px){.main{padding:0 60px 120px;}}

.sec-hd{padding:24px 0 14px;}
@media(min-width:768px){.sec-hd{padding:40px 0 20px;}}
.sec-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--br);}
@media(min-width:768px){.sec-title{font-size:26px;}}
@media(min-width:1024px){.sec-title{font-size:30px;}}

/* ══ 상품 - 모바일: 가로형 리스트 / PC: 그리드 카드 ══ */
.products{display:flex;flex-direction:column;gap:12px;}
@media(min-width:640px){
  .products{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
}
@media(min-width:960px){
  .products{grid-template-columns:repeat(3,1fr);gap:24px;}
}

/* 모바일 카드 (가로형) */
.product-card{
  background:#fff;border-radius:var(--r);border:1px solid var(--bds);
  overflow:hidden;display:flex;flex-direction:row;
  box-shadow:0 2px 8px rgba(45,31,14,.06);transition:transform .2s;
}
/* PC 카드 (세로형) */
@media(min-width:640px){
  .product-card{flex-direction:column;}
  .product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
}

/* 이미지 영역 */
.product-img-wrap{
  /* 모바일: 가로형 */
  width:120px;min-width:120px;height:120px;
  overflow:hidden;background:var(--ivory);position:relative;flex-shrink:0;
}
@media(min-width:640px){
  .product-img-wrap{width:100%;height:220px;min-width:unset;}
}
@media(min-width:960px){
  .product-img-wrap{height:260px;}
}
.product-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.product-img-ph{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--txt3);font-size:11px;gap:4px;
  background:linear-gradient(135deg,#F5F0E8,#EDE5D5);
}
.product-badge{
  position:absolute;top:7px;left:7px;
  background:var(--gr);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;
}

/* 상품 정보 */
.product-info{
  flex:1;padding:12px 14px;
  display:flex;flex-direction:column;justify-content:space-between;
  min-width:0;
}
@media(min-width:640px){.product-info{padding:20px;}}
@media(min-width:960px){.product-info{padding:22px;}}
.product-name{
  font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700;
  color:var(--br);margin-bottom:4px;line-height:1.3;
}
@media(min-width:640px){.product-name{font-size:17px;margin-bottom:8px;}}
@media(min-width:960px){.product-name{font-size:19px;}}
.product-desc{
  font-size:12px;color:var(--txt2);line-height:1.65;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  margin-bottom:10px;flex:1;
}
@media(min-width:640px){.product-desc{font-size:14px;}}
@media(min-width:640px){.-webkit-line-clamp:3;}
.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.product-price{font-size:15px;font-weight:800;color:var(--gr);}
@media(min-width:640px){.product-price{font-size:18px;}}
@media(min-width:960px){.product-price{font-size:20px;}}
.product-price-sub{font-size:10px;color:var(--txt3);margin-top:2px;}
@media(min-width:640px){.product-price-sub{font-size:12px;}}
.btn-product-order{
  border:none;border-radius:10px;padding:9px 16px;
  font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--gr),var(--gm));
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
@media(min-width:640px){.btn-product-order{font-size:14px;padding:10px 20px;}}

/* ══ 공지 ══ */
.divider{height:8px;background:var(--ivory);margin:24px -16px;}
@media(min-width:768px){.divider{margin:32px -32px;}}
@media(min-width:1024px){.divider{margin:32px -48px;}}

.notices{display:flex;flex-direction:column;gap:10px;}
@media(min-width:768px){
  .notices{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
}
.notice-card{
  background:#fff;border-radius:var(--r);border:1px solid var(--bds);
  padding:14px 16px;cursor:pointer;transition:.15s;
}
@media(min-width:768px){.notice-card{padding:20px 22px;}}
.notice-card:hover{background:var(--ivory);}
.notice-hd{display:flex;align-items:flex-start;gap:8px;}
.notice-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;margin-top:2px;}
@media(min-width:768px){.notice-badge{font-size:12px;padding:3px 10px;}}
.notice-badge.notice{background:#FEF3C7;color:#92400E;}
.notice-badge.event{background:var(--gd);color:var(--gr);}
.notice-badge.info{background:#EFF6FF;color:#1D4ED8;}
.notice-ttl{font-size:13px;font-weight:600;color:var(--br);flex:1;line-height:1.4;}
@media(min-width:768px){.notice-ttl{font-size:16px;font-weight:700;}}
.notice-date{font-size:11px;color:var(--txt3);margin-top:4px;}
@media(min-width:768px){.notice-date{font-size:13px;margin-top:6px;}}
.notice-preview{font-size:12px;color:var(--txt2);margin-top:5px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
@media(min-width:768px){.notice-preview{font-size:14px;margin-top:8px;}}

/* 공지 상세 */
.nd-ov{display:none;position:fixed;inset:0;z-index:800;background:var(--cream);overflow-y:auto;}
.nd-ov.show{display:block;}
.nd-hd{position:sticky;top:0;background:rgba(250,247,242,.96);backdrop-filter:blur(12px);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bds);}
.btn-back{border:none;background:none;font-size:22px;cursor:pointer;color:var(--br);}
.nd-hd-ttl{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--br);flex:1;}
.nd-body{padding:20px 16px;max-width:720px;margin:0 auto;}
@media(min-width:768px){.nd-body{padding:28px 24px;}}
.nd-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bds);}
.nd-title{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--br);line-height:1.4;margin-bottom:14px;}
.nd-img{width:100%;border-radius:var(--r);object-fit:cover;margin-bottom:16px;display:block;}
.nd-text{font-size:14px;color:var(--txt2);line-height:1.8;white-space:pre-wrap;}

/* ══ CTA ══ */
.cta-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  padding:10px 16px 18px;
  background:linear-gradient(to top,var(--cream) 65%,transparent);
}
.btn-cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;max-width:420px;margin:0 auto;
  padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--br),var(--bm));
  color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 18px rgba(45,31,14,.35);
  text-decoration:none;transition:.18s;
}
@media(min-width:768px){.btn-cta{max-width:440px;font-size:18px;padding:18px 32px;}}

/* 관리자 바 */
.admin-bar{display:none;position:fixed;bottom:68px;left:0;right:0;z-index:600;background:var(--br);padding:8px 16px;flex-wrap:wrap;gap:6px;justify-content:center;}
.admin-bar.show{display:flex;}
.btn-edit{border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);cursor:pointer;font-family:inherit;white-space:nowrap;}

/* 에디터 모달 */
.ed-ov{display:none;position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.6);align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
.ed-ov.show{display:flex;}
.ed-modal{background:#fff;border-radius:18px;width:100%;max-width:500px;overflow:hidden;margin:auto;box-shadow:0 16px 60px rgba(0,0,0,.3);}
.ed-hd{background:var(--br);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.ed-hd-title{font-size:14px;font-weight:800;color:#fff;}
.ed-close{border:none;background:none;color:rgba(255,255,255,.7);font-size:22px;cursor:pointer;}
.ed-body{padding:18px;display:flex;flex-direction:column;gap:12px;}
.ed-lbl{font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px;}
.ed-inp{width:100%;border:1.5px solid var(--bd);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--ivory);outline:none;}
.ed-inp:focus{border-color:var(--gr);}
.ed-ta{width:100%;border:1.5px solid var(--bd);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--ivory);outline:none;resize:vertical;min-height:90px;}
.ed-ta:focus{border-color:var(--gr);}
.ed-sel{width:100%;border:1.5px solid var(--bd);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--txt);background:var(--ivory);}
.ed-imgprev{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;border:1px solid var(--bd);display:none;margin-top:6px;}
.ed-foot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--bds);}
.btn-ed-save{flex:1;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gr),var(--gm));color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-ed-cancel{padding:12px 16px;border:1.5px solid var(--bd);border-radius:10px;background:none;color:var(--txt2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}

/* 로그인 모달 */
.lg-ov{display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px;}
.lg-ov.show{display:flex;}
.lg-modal{background:#fff;border-radius:18px;width:100%;max-width:320px;overflow:hidden;box-shadow:0 16px 60px rgba(0,0,0,.3);}
.lg-hd{background:linear-gradient(135deg,var(--br),var(--bm));padding:22px;text-align:center;}
.lg-hd-title{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:#fff;margin-top:6px;}
.lg-body{padding:20px;display:flex;flex-direction:column;gap:10px;}
.lg-inp{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--txt);outline:none;background:var(--ivory);}
.lg-inp:focus{border-color:var(--gr);}
.lg-err{font-size:12px;color:#E05040;text-align:center;display:none;}
.btn-lg{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gr),var(--gm));color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-lg-cancel{width:100%;padding:10px;border:none;background:none;color:var(--txt3);font-size:13px;cursor:pointer;font-family:inherit;}

/* 어드민 뱃지 */
.admin-badge{display:none;position:fixed;top:calc(var(--hh)+8px);right:10px;z-index:800;background:var(--gold);color:var(--br);font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;}
.admin-badge.show{display:block;}

/* 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--br);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;}
.toast.show{opacity:1;}

/* 빈상태 */
.empty{text-align:center;padding:36px 20px;color:var(--txt3);}
.empty-ico{font-size:34px;margin-bottom:8px;}

/* 푸터 */
.footer{background:var(--br);color:rgba(255,255,255,.6);padding:36px 24px 110px;text-align:center;font-size:13px;line-height:2;margin-top:24px;}
@media(min-width:768px){.footer{font-size:15px;padding:48px 40px 120px;}}
.footer-logo{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;}
@media(min-width:768px){.footer-logo{font-size:22px;}}
</style>
</head>
<body>

<!-- 헤더 -->
<header class="hdr">
  <a class="hdr-logo" href="#">
    <div class="hdr-logo-ico">🍐</div>
    <div class="hdr-logo-text">
      <div class="hdr-logo-main">남양주 먹골배 광진농원</div>
      <div class="hdr-logo-sub">Gwangjin Farm · Since 1990</div>
    </div>
  </a>
  <div class="hdr-btns">
    <button class="btn-admin" id="btnAdmin" onclick="window.open('gj-admin.html','_blank')">관리자</button>
    <button class="btn-order-hd" onclick="goOrder()">주문하기</button>
  </div>
</header>

<div class="admin-badge" id="adminBadge">🔑 관리자 모드</div>

<!-- 팝업 -->
<div class="popup-ov" id="popupOv">
  <div class="popup-modal">
    <div id="popupImgWrap">
      <div class="popup-img-ph" id="popupPh">
        <div style="font-size:40px;">🍐</div>
        <div style="font-size:14px;font-weight:700;">광진농원</div>
      </div>
    </div>
    <div class="popup-body">
      <div class="popup-title" id="popupTitle"></div>
      <div class="popup-desc" id="popupDesc"></div>
    </div>
    <div class="popup-foot">
      <button class="popup-btn" onclick="closePopupToday()">오늘 하루 보지 않기</button>
      <button class="popup-btn" onclick="closePopup()">닫기</button>
    </div>
  </div>
</div>

<!-- 배너 -->
<div class="banner-wrap">
  <div class="banner-track" id="bannerTrack"></div>
  <button class="banner-nav prev" onclick="bannerMove(-1)">‹</button>
  <button class="banner-nav next" onclick="bannerMove(1)">›</button>
  <div class="banner-dots" id="bannerDots"></div>
</div>

<!-- 메인 -->
<main class="main">
  <div class="sec-hd"><div class="sec-title">🍐 이번 시즌 배</div></div>
  <div class="products" id="productList"></div>
  <div class="divider"></div>
  <div class="sec-hd"><div class="sec-title">📋 공지사항</div></div>
  <div class="notices" id="noticeList"></div>
  <footer class="footer">
    <div class="footer-logo">🍐 남양주 먹골배 광진농원</div>
    <div>경기 남양주시 별내면 광전리 269-2</div>
    <div>📞 010-7146-1084</div>
    <div style="margin-top:8px;font-size:11px;">© 2024 광진농원. All rights reserved.</div>
  </footer>
</main>

<!-- CTA -->
<div class="cta-bar">
  <a class="btn-cta" href="https://santar7021-ux.github.io/gwangjin/" target="_blank">🛒 지금 배 주문하기</a>
</div>

<!-- 관리자 바 -->
<div class="admin-bar" id="adminBar">
  <button class="btn-edit" onclick="openEditor('banner')">+ 배너</button>
  <button class="btn-edit" onclick="openEditor('product')">+ 상품</button>
  <button class="btn-edit" onclick="openEditor('notice')">+ 공지</button>
  <button class="btn-edit" onclick="openEditor('popup')">팝업</button>
  <button class="btn-edit" style="background:rgba(220,50,50,.2);" onclick="adminLogout()">로그아웃</button>
</div>

<!-- 공지 상세 -->
<div class="nd-ov" id="ndOv">
  <div class="nd-hd">
    <button class="btn-back" onclick="closeND()">←</button>
    <div class="nd-hd-ttl">공지사항</div>
  </div>
  <div class="nd-body">
    <div class="nd-meta">
      <span class="notice-badge" id="ndBadge"></span>
      <span style="font-size:12px;color:var(--txt3);" id="ndDate"></span>
    </div>
    <div class="nd-title" id="ndTitle"></div>
    <img class="nd-img" id="ndImg" src="" alt="">
    <div class="nd-text" id="ndText"></div>
  </div>
</div>

<!-- 에디터 -->
<div class="ed-ov" id="edOv">
  <div class="ed-modal">
    <div class="ed-hd">
      <div class="ed-hd-title" id="edTitle">편집</div>
      <button class="ed-close" onclick="closeED()">✕</button>
    </div>
    <div class="ed-body" id="edBody"></div>
    <div class="ed-foot">
      <button class="btn-ed-cancel" onclick="closeED()">취소</button>
      <button class="btn-ed-save" onclick="saveED()">저장</button>
    </div>
  </div>
</div>

<!-- 로그인 -->
<div class="lg-ov" id="lgOv">
  <div class="lg-modal">
    <div class="lg-hd">
      <div style="font-size:30px;">🔑</div>
      <div class="lg-hd-title">관리자 로그인</div>
    </div>
    <div class="lg-body">
      <input class="lg-inp" id="lgId" type="text" placeholder="아이디" autocomplete="off">
      <input class="lg-inp" id="lgPw" type="password" placeholder="비밀번호">
      <div class="lg-err" id="lgErr">아이디 또는 비밀번호가 틀렸어요.</div>
      <button class="btn-lg" onclick="doLogin()">로그인</button>
      <button class="btn-lg-cancel" onclick="closeLG()">취소</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORE_KEY='gwangjin_home_v1';
var ADMIN_ID='gwangjin';
var ADMIN_PW='105709';
var isAdmin=false;
var edMode='';
var edIdx=-1;

function loadData(){try{var r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r);}catch(e){}return defData();}
function saveData(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}
function defData(){return{
  banners:[
    {title:'남양주 먹골배\n광진농원',sub:'산지 직배송으로 만나는 신선한 먹골배',imgUrl:'https://drive.google.com/uc?export=view&id=1GlvS__fNWBPQaLOCr3wPmL5NVwAZAolM',bg:'#2D1F0E'},
    {title:'올해 햇배 입고!',sub:'신선한 신고배 · 황금배 지금 주문하세요',imgUrl:'https://drive.google.com/uc?export=view&id=1saLBL0NLE9nPlM6SZXvwCWAR7-hKYDpC',bg:'#3B2A1A'},
    {title:'택배 주문 안내',sub:'전국 택배 배송 · 1박스 4,000원',imgUrl:'',bg:'#4A3828'}
  ],
  products:[
    {name:'신고 10과 (3.5kg)',desc:'달콤하고 과즙이 풍부한 프리미엄 신고배입니다. 산지 직배송으로 신선함을 그대로 전달해 드립니다.',price:'45,000원',badge:'BEST',imgUrl:'https://drive.google.com/uc?export=view&id=1miwoeGXSaBahsxTEu-yIrZoQG0tZu8Nd'},
    {name:'신고 13과 (3.5kg)',desc:'알이 굵고 단단한 신고배 13과입니다. 선물용으로 인기가 많은 상품입니다.',price:'34,000원',badge:'',imgUrl:''},
    {name:'신고 15과 (3.5kg)',desc:'실속형 소과 신고배입니다. 합리적인 가격으로 먹골배의 맛을 즐겨보세요.',price:'30,000원',badge:'실속',imgUrl:''}
  ],
  notices:[
    {type:'notice',title:'2024년 햇배 입고 안내',text:'안녕하세요, 광진농원입니다.\n올해 신선한 햇배가 입고되었습니다.\n택배 주문은 홈페이지 주문서를 이용해 주세요.',imgUrl:'',date:'2024-09-01'},
    {type:'event',title:'추석 선물세트 특별 할인',text:'추석을 맞아 선물세트를 특별 할인 판매합니다.',imgUrl:'',date:'2024-08-20'}
  ],
  popup:{show:true,title:'남양주 먹골배 입고!',desc:'신선한 먹골배가 입고됐습니다. 지금 바로 주문해 보세요!',imgUrl:''}
};}

var DB=loadData();

/* 배너 */
var bIdx=0,bTimer=null;
function renderBanners(){
  var tr=document.getElementById('bannerTrack'),dots=document.getElementById('bannerDots');
  tr.innerHTML='';dots.innerHTML='';
  if(!DB.banners.length){
    tr.innerHTML='<div style="min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#2D1F0E;"><div style="text-align:center;color:#fff;"><div style="font-size:50px;">🍐</div><div style="font-size:20px;font-weight:700;margin-top:10px;">광진농원</div></div></div>';
    return;
  }
  DB.banners.forEach(function(b,i){
    var s=document.createElement('div');
    s.style.cssText='min-width:100%;height:100%;position:relative;flex-shrink:0;';
    if(b.imgUrl){
      s.innerHTML='<img src="'+b.imgUrl+'" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.display=\'none\'">'
        +'<div class="banner-ov"><div class="banner-title">'+b.title.replace(/\n/g,'<br>')+'</div><div class="banner-sub">'+b.sub+'</div></div>';
    }else{
      s.innerHTML='<div style="width:100%;height:100%;background:'+b.bg+';"></div>'
        +'<div class="banner-ov"><div class="banner-title">'+b.title.replace(/\n/g,'<br>')+'</div><div class="banner-sub">'+b.sub+'</div></div>';
    }
    tr.appendChild(s);
    var d=document.createElement('div');
    d.className='banner-dot'+(i===0?' act':'');
    d.onclick=(function(n){return function(){goBanner(n);};})(i);
    dots.appendChild(d);
  });
  startBA();
}
function goBanner(n){bIdx=n;document.getElementById('bannerTrack').style.transform='translateX(-'+n*100+'%)';document.querySelectorAll('.banner-dot').forEach(function(d,i){d.classList.toggle('act',i===n);});}
function bannerMove(dir){var n=(bIdx+dir+DB.banners.length)%DB.banners.length;goBanner(n);resetBA();}
function startBA(){clearInterval(bTimer);if(DB.banners.length>1)bTimer=setInterval(function(){bannerMove(1);},4000);}
function resetBA(){clearInterval(bTimer);startBA();}

/* 상품 */
function renderProducts(){
  var el=document.getElementById('productList');
  if(!DB.products.length){el.innerHTML='<div class="empty"><div class="empty-ico">🍐</div><p>등록된 상품이 없어요.</p></div>';return;}
  el.innerHTML=DB.products.map(function(p,i){
    var img=p.imgUrl
      ?'<img src="'+p.imgUrl+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">'
      :'<div class="product-img-ph"><div style="font-size:28px;">🍐</div><div>사진 없음</div></div>';
    var badge=p.badge?'<div class="product-badge">'+p.badge+'</div>':'';
    var eb=isAdmin?'<button class="btn-edit" style="font-size:11px;padding:4px 8px;" onclick="openEditor(\'product\','+i+')">수정</button>':'';
    return '<div class="product-card">'
      +'<div class="product-img-wrap">'+img+badge+'</div>'
      +'<div class="product-info">'
        +'<div>'
          +'<div class="product-name">'+p.name+'</div>'
          +'<div class="product-desc">'+p.desc+'</div>'
        +'</div>'
        +'<div class="product-bottom">'
          +'<div><div class="product-price">'+p.price+'</div><div class="product-price-sub">+ 택배비 4,000원</div></div>'
          +'<div style="display:flex;gap:5px;align-items:center;">'+eb+'<button class="btn-product-order" onclick="goOrder()">주문</button></div>'
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

/* 공지 */
function renderNotices(){
  var el=document.getElementById('noticeList'),tm={notice:'공지',event:'이벤트',info:'안내'};
  if(!DB.notices.length){el.innerHTML='<div class="empty"><div class="empty-ico">📋</div><p>등록된 공지가 없어요.</p></div>';return;}
  el.innerHTML=DB.notices.map(function(n,i){
    var eb=isAdmin?'<button class="btn-edit" style="font-size:11px;padding:3px 7px;margin-top:6px;" onclick="event.stopPropagation();openEditor(\'notice\','+i+')">수정</button>':'';
    return '<div class="notice-card" onclick="openND('+i+')">'
      +'<div class="notice-hd"><span class="notice-badge '+n.type+'">'+tm[n.type]+'</span><div class="notice-ttl">'+n.title+'</div></div>'
      +'<div class="notice-date">'+n.date+'</div>'
      +'<div class="notice-preview">'+n.text+'</div>'
      +eb+'</div>';
  }).join('');
}
function openND(i){
  var n=DB.notices[i],tm={notice:'공지',event:'이벤트',info:'안내'};
  document.getElementById('ndBadge').textContent=tm[n.type];
  document.getElementById('ndBadge').className='notice-badge '+n.type;
  document.getElementById('ndDate').textContent=n.date;
  document.getElementById('ndTitle').textContent=n.title;
  document.getElementById('ndText').textContent=n.text;
  var img=document.getElementById('ndImg');
  if(n.imgUrl){img.src=n.imgUrl;img.style.display='block';}else img.style.display='none';
  document.getElementById('ndOv').classList.add('show');
}
function closeND(){document.getElementById('ndOv').classList.remove('show');}

/* 팝업 */
function initPopup(){
  if(!DB.popup.show)return;
  var today=new Date().toDateString();
  if(localStorage.getItem('gwangjin_popup_hide')===today)return;
  document.getElementById('popupTitle').textContent=DB.popup.title;
  document.getElementById('popupDesc').textContent=DB.popup.desc;
  if(DB.popup.imgUrl){
    document.getElementById('popupPh').style.display='none';
    var img=document.createElement('img');img.src=DB.popup.imgUrl;img.className='popup-img';
    document.getElementById('popupImgWrap').appendChild(img);
  }
  document.getElementById('popupOv').classList.add('show');
}
function closePopup(){document.getElementById('popupOv').classList.remove('show');}
function closePopupToday(){localStorage.setItem('gwangjin_popup_hide',new Date().toDateString());closePopup();}

/* 관리자 */
function showLogin(){document.getElementById('lgOv').classList.add('show');}
function closeLG(){document.getElementById('lgOv').classList.remove('show');}
function doLogin(){
  var id=document.getElementById('lgId').value.trim();
  var pw=document.getElementById('lgPw').value.trim();
  if(id===ADMIN_ID&&pw===ADMIN_PW){
    isAdmin=true;closeLG();
    document.getElementById('adminBadge').classList.add('show');
    document.getElementById('adminBar').classList.add('show');
    renderProducts();renderNotices();
    showToast('관리자 모드 👋');
  }else{document.getElementById('lgErr').style.display='block';}
}
function adminLogout(){
  isAdmin=false;
  document.getElementById('adminBadge').classList.remove('show');
  document.getElementById('adminBar').classList.remove('show');
  renderProducts();renderNotices();showToast('로그아웃됐어요.');
}
document.getElementById('lgPw').onkeydown=function(e){if(e.key==='Enter')doLogin();};

/* 에디터 */
function openEditor(mode,idx){
  edMode=mode;edIdx=idx===undefined?-1:idx;
  var titles={banner:'배너 설정',product:'상품 등록/수정',notice:'공지사항 작성',popup:'팝업 배너 설정'};
  document.getElementById('edTitle').textContent=titles[mode];
  var body=document.getElementById('edBody');
  body.innerHTML=buildForm(mode,idx);
  document.getElementById('edOv').classList.add('show');
  var ui=body.querySelector('.ed-img-url'),pr=body.querySelector('.ed-imgprev');
  if(ui&&pr){
    ui.addEventListener('input',function(){if(this.value){pr.src=this.value;pr.style.display='block';}else pr.style.display='none';});
    if(ui.value){pr.src=ui.value;pr.style.display='block';}
  }
}
function closeED(){document.getElementById('edOv').classList.remove('show');}
function buildForm(mode,idx){
  var d={};
  if(mode==='banner')d=(idx>=0&&DB.banners[idx])?DB.banners[idx]:{title:'',sub:'',imgUrl:'',bg:'#2D1F0E'};
  if(mode==='product')d=(idx>=0&&DB.products[idx])?DB.products[idx]:{name:'',desc:'',price:'',badge:'',imgUrl:''};
  if(mode==='notice')d=(idx>=0&&DB.notices[idx])?DB.notices[idx]:{type:'notice',title:'',text:'',imgUrl:'',date:new Date().toISOString().slice(0,10)};
  if(mode==='popup')d=DB.popup;
  var del=(idx>=0)?'<button type="button" onclick="deleteItem()" style="color:#E05040;background:none;border:none;font-size:13px;cursor:pointer;padding:4px;">🗑 삭제</button>':'';
  if(mode==='banner')return '<div><div class="ed-lbl">제목</div><textarea class="ed-ta" id="ef_title" style="min-height:55px;">'+d.title+'</textarea></div><div><div class="ed-lbl">부제목</div><input class="ed-inp" id="ef_sub" value="'+d.sub+'"></div><div><div class="ed-lbl">이미지 URL</div><input class="ed-inp ed-img-url" id="ef_imgUrl" value="'+(d.imgUrl||'')+'" placeholder="https://..."><img class="ed-imgprev"></div><div style="display:flex;justify-content:flex-end;">'+del+'</div>';
  if(mode==='product')return '<div><div class="ed-lbl">상품명</div><input class="ed-inp" id="ef_name" value="'+d.name+'"></div><div><div class="ed-lbl">설명</div><textarea class="ed-ta" id="ef_desc">'+d.desc+'</textarea></div><div><div class="ed-lbl">가격</div><input class="ed-inp" id="ef_price" value="'+d.price+'" placeholder="45,000원"></div><div><div class="ed-lbl">뱃지 (BEST·신상·실속 등)</div><input class="ed-inp" id="ef_badge" value="'+d.badge+'"></div><div><div class="ed-lbl">이미지 URL</div><input class="ed-inp ed-img-url" id="ef_imgUrl" value="'+(d.imgUrl||'')+'" placeholder="https://..."><img class="ed-imgprev"></div><div style="display:flex;justify-content:flex-end;">'+del+'</div>';
  if(mode==='notice')return '<div><div class="ed-lbl">유형</div><select class="ed-sel" id="ef_type"><option value="notice"'+(d.type==='notice'?' selected':'')+'>공지</option><option value="event"'+(d.type==='event'?' selected':'')+'>이벤트</option><option value="info"'+(d.type==='info'?' selected':'')+'>안내</option></select></div><div><div class="ed-lbl">제목</div><input class="ed-inp" id="ef_title" value="'+d.title+'"></div><div><div class="ed-lbl">내용</div><textarea class="ed-ta" id="ef_text">'+d.text+'</textarea></div><div><div class="ed-lbl">날짜</div><input class="ed-inp" id="ef_date" type="date" value="'+d.date+'"></div><div><div class="ed-lbl">이미지 URL</div><input class="ed-inp ed-img-url" id="ef_imgUrl" value="'+(d.imgUrl||'')+'" placeholder="https://..."><img class="ed-imgprev"></div><div style="display:flex;justify-content:flex-end;">'+del+'</div>';
  if(mode==='popup')return '<div><div class="ed-lbl">팝업 표시</div><select class="ed-sel" id="ef_show"><option value="1"'+(d.show?' selected':'')+'>표시</option><option value="0"'+(!d.show?' selected':'')+'>숨김</option></select></div><div><div class="ed-lbl">제목</div><input class="ed-inp" id="ef_title" value="'+d.title+'"></div><div><div class="ed-lbl">내용</div><textarea class="ed-ta" id="ef_desc">'+d.desc+'</textarea></div><div><div class="ed-lbl">이미지 URL</div><input class="ed-inp ed-img-url" id="ef_imgUrl" value="'+(d.imgUrl||'')+'" placeholder="https://..."><img class="ed-imgprev"></div>';
}
function g(id){var el=document.getElementById(id);return el?el.value:'';}
function saveED(){
  if(edMode==='banner'){var it={title:g('ef_title'),sub:g('ef_sub'),imgUrl:g('ef_imgUrl'),bg:'#2D1F0E'};if(edIdx>=0)DB.banners[edIdx]=it;else DB.banners.push(it);saveData(DB);closeED();renderBanners();showToast('배너 저장!');}
  if(edMode==='product'){var it={name:g('ef_name'),desc:g('ef_desc'),price:g('ef_price'),badge:g('ef_badge'),imgUrl:g('ef_imgUrl')};if(edIdx>=0)DB.products[edIdx]=it;else DB.products.push(it);saveData(DB);closeED();renderProducts();showToast('상품 저장!');}
  if(edMode==='notice'){var it={type:g('ef_type'),title:g('ef_title'),text:g('ef_text'),date:g('ef_date'),imgUrl:g('ef_imgUrl')};if(edIdx>=0)DB.notices[edIdx]=it;else DB.notices.unshift(it);saveData(DB);closeED();renderNotices();showToast('공지 저장!');}
  if(edMode==='popup'){DB.popup={show:g('ef_show')==='1',title:g('ef_title'),desc:g('ef_desc'),imgUrl:g('ef_imgUrl')};saveData(DB);closeED();showToast('팝업 저장!');}
}
function deleteItem(){
  if(!confirm('삭제할까요?'))return;
  if(edMode==='banner'&&edIdx>=0){DB.banners.splice(edIdx,1);saveData(DB);closeED();renderBanners();}
  if(edMode==='product'&&edIdx>=0){DB.products.splice(edIdx,1);saveData(DB);closeED();renderProducts();}
  if(edMode==='notice'&&edIdx>=0){DB.notices.splice(edIdx,1);saveData(DB);closeED();renderNotices();}
  showToast('삭제됐어요.');
}
function goOrder(){window.open('https://santar7021-ux.github.io/gwangjin/','_blank');}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

renderBanners();renderProducts();renderNotices();initPopup();
</script>
</body>
</html>
